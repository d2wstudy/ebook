name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'book.config.ts'
      - 'content/**'
      - 'docs/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate deployment configuration
        shell: bash
        env:
          CONFIG_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          CONFIG_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          if [[ -z "$CONFIG_WORKER_URL" || ! "$CONFIG_WORKER_URL" =~ ^https:// || "$CONFIG_WORKER_URL" == *".invalid"* ]]; then
            echo "::error::Set the repository variable VITE_WORKER_URL to the deployed HTTPS Worker URL."
            exit 1
          fi
          echo "VITE_WORKER_URL=$CONFIG_WORKER_URL" >> "$GITHUB_ENV"
          if [[ -n "$CONFIG_GITHUB_CLIENT_ID" ]]; then
            echo "VITE_GITHUB_CLIENT_ID=$CONFIG_GITHUB_CLIENT_ID" >> "$GITHUB_ENV"
          fi

      - name: Build site and validate search index
        run: npm run build
        env:
          SEARCH_INDEX_WARN_GZIP_KB: '5120'
          SEARCH_INDEX_MAX_GZIP_KB: '10240'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
